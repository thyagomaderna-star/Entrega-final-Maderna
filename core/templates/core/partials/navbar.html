<header class="navbar">
    <div class="container navbar__inner">
        <a href="{% url 'inicio' %}" class="navbar__brand">⚽ FÚTBOL BLOG</a>
        
        <nav class="navbar__links">
            <a href="{% url 'inicio' %}">Inicio</a>
            <a href="{% url 'user_list' %}">Usuarios</a>
            <a href="{% url 'equipo_list' %}">Equipos</a>
            <a href="{% url 'post_list' %}">Posts</a>
            
            {% if user.is_authenticated %}
                <a href="{% url 'perfil_detail' %}">Mi Perfil</a>
                <form action="{% url 'logout' %}" method="POST">
                    {% csrf_token %}
                    <button type="submit" class="btn">Salir</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'register' %}" class="btn">Registrarse</a>
            {% endif %}
        </nav>
    </div>
</header>
